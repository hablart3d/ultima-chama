<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="A escuridão devora tudo. Sua chama é sua vida e sua luz. Jogo de sobrevivência grátis no navegador.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Última Chama</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f4e9d8}
canvas{display:block;width:100vw;height:100vh}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;background:rgba(4,0,8,.74);text-align:center;padding:16px;box-sizing:border-box;overflow-y:auto}
.screen.on{display:flex}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
#menu{background:radial-gradient(circle at 50% 55%,rgba(40,12,0,.35),rgba(2,0,6,.86) 60%)}
#buyS{background:radial-gradient(circle at 50% 30%,rgba(70,20,0,.55),rgba(2,0,6,.92) 65%)}
h1{font-size:clamp(40px,9vw,84px);margin:0 0 6px;letter-spacing:.03em;color:#ffcf70;text-shadow:0 0 18px #ff7a00,0 0 50px #ff3d00;line-height:1}
h2{font-size:clamp(26px,5vw,40px);margin:0 0 14px;color:#ffcf70;text-shadow:0 0 16px #ff5a00}
p{margin:6px 0;max-width:560px;line-height:1.45;color:#d9c8b4}
.small{font-size:13px;opacity:.7}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;padding:3px 8px;border:1px solid #ff8a3d;border-radius:20px;color:#ffb070;margin-bottom:14px}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(#ff9a1f,#ff4d00);color:#1d0900;border:0;border-radius:12px;padding:13px 22px;font-weight:800;font-size:18px;min-width:240px;margin:5px;box-shadow:0 0 22px rgba(255,90,0,.35)}
.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:#ffcf9a;border:1.5px solid rgba(255,140,60,.6);box-shadow:none;font-weight:700;font-size:16px}
.btn:disabled{opacity:.35;cursor:default}
.btn .sub{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:2px}
.col{display:flex;flex-direction:column;align-items:center;margin:12px 0}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:760px;width:100%}
.card{position:relative;flex:1 1 190px;max-width:220px;background:linear-gradient(#21122b,#140a1b);border:1.5px solid rgba(255,138,61,.35);border-radius:14px;padding:16px 14px 14px;text-align:left;color:#f4e9d8;display:flex;flex-direction:column;gap:6px}
.card:hover,.card:focus{border-color:#ffb347;outline:none;box-shadow:0 0 20px rgba(255,120,0,.3)}
.card .ic{font-size:30px;color:#ffb347;text-shadow:0 0 12px #ff6a00;line-height:1}
.card .nm{font-weight:800;font-size:18px}
.card .tg{font-size:12px;font-weight:700;letter-spacing:.08em;color:#ff9a4d}
.card .ds{font-size:14px;color:#cdb9a3;line-height:1.35}
.card .k{position:absolute;top:10px;right:12px;font-size:12px;opacity:.45}
.card.mini{flex:1 1 130px;max-width:180px;padding:12px;gap:4px}
.card.mini .nm{font-size:16px}
.card.mini .ds{font-size:13px}
.card.sel{border-color:#ffcf70;box-shadow:0 0 0 1.5px #ffcf70,0 0 22px rgba(255,140,0,.3)}
.card.locked{opacity:.62}
.card.locked .nm::after{content:" 🔒"}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:20px;background:#3a1a05;color:#ffb070;width:max-content}
.pill.free{background:#123018;color:#9fe0a0}
.dot{width:30px;height:30px;border-radius:50%;display:inline-block}
.sect{width:100%;max-width:760px;margin:4px 0 10px}
.sect h3{margin:0 0 8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#cdb9a3;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:6px 20px;margin:2px 0 10px;font-size:13px;color:#cdb9a3}
.stats b{color:#f4e9d8;display:block;font-size:20px}
.score{margin:2px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#cdb9a3}
.score b{display:block;font-size:46px;line-height:1.1;color:#ffcf70;text-shadow:0 0 18px #ff5a00;letter-spacing:0}
.score em{display:block;font-style:normal;font-weight:900;color:#fff1a8;font-size:16px;letter-spacing:.14em;min-height:1.2em;text-shadow:0 0 12px #ff9a00}
.nickbox,.boardbox{width:100%;max-width:440px;margin:2px 0 6px}
#nickForm{display:flex;gap:8px;justify-content:center}
.txt{flex:1;min-width:0;width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:11px 12px;border-radius:10px;border:1.5px solid rgba(255,140,60,.6);background:#1a0f22;color:#fff4e6;user-select:text;-webkit-user-select:text;outline:none}
.txt:focus{border-color:#ffcf70;box-shadow:0 0 14px rgba(255,140,0,.3)}
#nickForm .btn{min-width:0;margin:0;padding:11px 18px;font-size:16px}
.err{color:#ff8a7a;min-height:1.2em;font-size:14px;margin:6px auto}
.err.ok{color:#9fe0a0}
.link{background:none;border:0;color:#cdb9a3;text-decoration:underline;font-size:14px;padding:4px}
.board{list-style:none;padding:0;margin:6px auto;width:100%;max-width:440px;text-align:left}
.board li{display:grid;grid-template-columns:42px 1fr auto 52px;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;font-size:15px}
.board li:nth-child(odd){background:rgba(40,20,50,.55)}
.board li.first{background:linear-gradient(90deg,rgba(255,190,60,.3),rgba(255,120,0,.08));color:#ffe08a;font-weight:800;font-size:16px}
.board li.me{box-shadow:inset 0 0 0 1.5px #ffb347}
.board li.sep,.board li.empty{display:block;text-align:center;background:none;opacity:.6;padding:2px}
.board li.empty{opacity:.8;padding:10px}
.board .pos{font-weight:800;color:#ff9a4d}
.board li.first .pos{font-size:19px}
.board .nk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-weight:800;font-variant-numeric:tabular-nums}
.board .tm{opacity:.7;text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 8px;max-width:560px}
.tab{background:transparent;border:1.5px solid rgba(255,140,60,.45);color:#ffcf9a;border-radius:20px;padding:6px 12px;font-weight:700;font-size:14px}
.tab.on{background:#ff8a1f;color:#1d0900;border-color:#ff8a1f}
.feats{list-style:none;padding:0;margin:8px 0;width:100%;max-width:460px;text-align:left}
.feats li{padding:10px 12px;margin:7px 0;background:#1a0f22;border:1px solid rgba(255,138,61,.25);border-radius:10px;line-height:1.35}
.price{font-size:22px;font-weight:800;color:#ffcf70;margin:6px 0}
.chk{display:flex;gap:10px;align-items:flex-start;text-align:left;max-width:440px;margin:12px auto;font-size:14px;color:#d9c8b4;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:#ff8a1f}
#notifyForm{display:flex;flex-direction:column;align-items:center}
.shop{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px;background:#1a0f22;border:1px solid rgba(255,138,61,.25);border-radius:12px;padding:12px;text-align:left}
.row .tx{flex:1}
.row .nm{font-weight:800}
.row .ds{font-size:13px;color:#cdb9a3}
.pips{font-size:12px;color:#ff9a4d;letter-spacing:2px}
.row .btn{min-width:0;font-size:15px;padding:9px 14px;margin:0}
#over .col{flex-direction:row;flex-wrap:wrap;justify-content:center;max-width:560px}
#over .col .btn{min-width:200px}
#pbtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,140,60,.4);background:rgba(20,8,28,.6);color:#ffcf9a;font-size:18px;display:none;z-index:5}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a1405;color:#ffcf9a;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:86vw;text-align:center;line-height:1.4}
@media (max-width:520px){
  .card{max-width:100%;flex-basis:100%}
  .card.mini{flex:1 1 28%;max-width:none;padding:10px 8px;align-items:center;text-align:center}
  .card.mini .ds{display:none}
  .card.mini .nm{font-size:13px}
  .card.locked .nm::after{content:""}
  .btn{min-width:200px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pbtn" aria-label="pause">II</button>
<div id="toast"></div>

<div id="menu" class="screen on">
  <span class="badge" id="demoBadge">DEMO</span>
  <h1 data-t="title"></h1>
  <p data-t="tag"></p>
  <div class="col">
    <button class="btn" id="bPlay" data-t="play"></button>
    <button class="btn sec" id="bDaily"></button>
    <button class="btn sec" id="bRank" data-t="ranking"></button>
    <button class="btn sec" id="bShop" data-t="shop"></button>
    <button class="btn sec" id="bFullMenu"></button>
    <button class="btn sec" id="bInstall"></button>
    <button class="btn sec" id="bSound"></button>
  </div>
  <p class="small" data-t="how"></p>
  <p class="small" data-t="how2"></p>
  <p class="small" id="bestLine"></p>
  <p class="small" id="playerLine"></p>
  <p class="small" id="ver"></p>
</div>

<div id="setupS" class="screen">
  <h2 data-t="prepare"></h2>
  <div class="sect"><h3 data-t="flameSel"></h3><div class="cards" id="flameCards"></div></div>
  <div class="sect"><h3 data-t="mapSel"></h3><div class="cards" id="mapCards"></div></div>
  <div class="sect"><h3 data-t="modeSel"></h3><div class="cards" id="modeCards"></div></div>
  <div class="col">
    <button class="btn" id="bGo" data-t="play"></button>
    <button class="btn sec" id="bSetupBack" data-t="back"></button>
  </div>
</div>

<div id="buyS" class="screen">
  <span class="badge" data-t="locked"></span>
  <h2 data-t="fullTitle"></h2>
  <p data-t="fullTag"></p>
  <ul class="feats" id="featList"></ul>
  <div class="price" id="priceLine"></div>
  <div class="col">
    <button class="btn" id="bBuy"></button>
    <button class="btn sec" id="bNotify" data-t="notify"></button>
    <button class="btn sec" id="bBuyBack" data-t="back"></button>
  </div>
</div>

<div id="notifyS" class="screen">
  <h2 data-t="notify"></h2>
  <p data-t="notifyD"></p>
  <form id="notifyForm" class="nickbox">
    <input id="emailIn" class="txt" type="email" autocomplete="email" inputmode="email" maxlength="254">
    <label class="chk"><input type="checkbox" id="consentIn"><span data-t="consent"></span></label>
    <button class="btn" type="submit" data-t="send"></button>
  </form>
  <p class="err" id="notifyMsg"></p>
  <p class="small" data-t="privacy"></p>
  <div class="col"><button class="btn sec" id="bNotifyBack" data-t="back"></button></div>
</div>

<div id="shopS" class="screen">
  <h2 data-t="shop"></h2>
  <p id="ashLine"></p>
  <div class="shop" id="shopList"></div>
  <button class="btn sec" id="bShopBack" data-t="back"></button>
</div>

<div id="rankS" class="screen">
  <h2 data-t="ranking"></h2>
  <div class="tabs" id="rankTabs"></div>
  <p id="rankMe"></p>
  <ol id="rankList" class="board"></ol>
  <p class="small" id="rankNote"></p>
  <div class="col">
    <button class="btn sec" id="bSwitch" data-t="switchP"></button>
    <button class="btn sec" id="bRankBack" data-t="back"></button>
  </div>
</div>

<div id="lvl" class="screen">
  <h2 data-t="choose"></h2>
  <div class="cards" id="cards"></div>
  <div class="col"><button class="btn sec" id="bReroll"></button></div>
</div>

<div id="pause" class="screen">
  <h2 data-t="paused"></h2>
  <div class="col">
    <button class="btn" id="bResume" data-t="resume"></button>
    <button class="btn sec" id="bSound2"></button>
    <button class="btn sec" id="bQuit" data-t="menu"></button>
  </div>
</div>

<div id="over" class="screen">
  <h2 id="overTitle"></h2>
  <p class="small" id="modeLine"></p>
  <p id="overText"></p>
  <div class="score"><span data-t="score"></span><b id="scoreVal"></b><em id="recordTag"></em></div>
  <div class="stats" id="stats"></div>
  <div id="nickBox" class="nickbox">
    <p data-t="yourNick"></p>
    <form id="nickForm"><input id="nickIn" class="txt" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" type="submit" data-t="save"></button></form>
    <p class="err" id="nickErr"></p>
    <button class="link" id="bSkip" type="button" data-t="skip"></button>
  </div>
  <div id="boardBox" class="boardbox">
    <p id="rankLine"></p>
    <ol id="boardList" class="board"></ol>
  </div>
  <div class="col">
    <button class="btn sec" id="bSeeFull" data-t="seeFull"></button>
    <button class="btn" id="bAgain" data-t="again"></button>
    <button class="btn sec" id="bShare" data-t="share"></button>
    <button class="btn sec" id="bDiscord" data-t="discord"></button>
    <button class="btn sec" id="bMenu" data-t="menu"></button>
  </div>
</div>

const LocalBoard={
  KEY:'ultima-chama-board-v1',
  load(){try{return JSON.parse(localStorage.getItem(this.KEY))||{players:{}}}catch(e){return {players:{}}}},
  store(d){try{localStorage.setItem(this.KEY,JSON.stringify(d))}catch(e){}},
  bestOf(p,mode){return (p.bests&&p.bests[mode])||(mode==='main'?p.best:null)},
  sorted(d,mode){return Object.values(d.players).map(p=>{const b=this.bestOf(p,mode);return b?Object.assign({nick:p.nick},b):null}).filter(Boolean).sort((a,b)=>b.score-a.score||a.date-b.date)},
  async claim(nick,token){const d=this.load(),k=nick.toLowerCase(),p=d.players[k];if(p&&p.token!==token)return {ok:false,error:'taken'};if(!p){d.players[k]={nick,token,bests:{}};this.store(d)}return {ok:true,nick:p?p.nick:nick}},
  async submit(nick,token,run,mode){
    const d=this.load(),p=d.players[nick.toLowerCase()];if(!p||p.token!==token)return {ok:false,error:'taken'};
    p.bests=p.bests||{};if(p.best&&!p.bests.main){p.bests.main=p.best;delete p.best}
    let improved=false;const cur=p.bests[mode];if(!cur||run.score>cur.score){p.bests[mode]=run;improved=true}this.store(d);
    const list=this.sorted(d,mode),rank=list.findIndex(x=>x.nick===p.nick)+1;
    return {ok:true,improved,rank,total:list.length,best:p.bests[mode]};
  },
  async top(n,mode){return this.sorted(this.load(),mode).slice(0,n)},
  async me(nick,mode){const list=this.sorted(this.load(),mode),i=list.findIndex(x=>x.nick.toLowerCase()===nick.toLowerCase());return i<0?null:Object.assign({rank:i+1,total:list.length},list[i])},
  async subscribe(){return {ok:false,error:'offline'}}
};
const OnlineBoard={
  async rpc(fn,body){
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);
    try{
      const h={'Content-Type':'application/json',apikey:CONFIG.supabaseKey};
      if(CONFIG.supabaseKey.startsWith('eyJ'))h.Authorization='Bearer '+CONFIG.supabaseKey;
      const r=await fetch(CONFIG.supabaseUrl.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body),signal:ctl.signal});
      if(!r.ok)throw new Error('http '+r.status);
      return await r.json();
    }finally{clearTimeout(tm)}
  },
  claim(nick,token){return this.rpc('claim_nick',{p_nick:nick,p_token:token})},
  submit(nick,token,run,mode){
    const base={p_nick:nick,p_token:token,p_time:run.time,p_kills:run.kills,p_lvl:run.lvl};

let AC=null,master=null,noiseBuf=null,pickCombo=0,pickT=0,MUS=null;
function initAudio(){

function tone(fr,dur,type,vol,slide,when){
  if(!AC)return;const t0=when||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(fr,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,fr*slide),t0+dur);
  g.gain.setValueAtTime(vol||.1,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);
}
function noise(dur,vol,fc,type,sweep){
  if(!AC)return;const t0=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type=type||'lowpass';f.frequency.setValueAtTime(fc,t0);if(sweep)f.frequency.exponentialRampToValueAtTime(fc*sweep,t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur);
}
const lastS={};
function sfx(n){
  if(!AC||save.mute)return;const now=AC.currentTime;
  const gap={shoot:.06,hit:.04,kill:.035,pick:.03,explode:.06,telegraph:.15,dash:.1}[n]||0;
  if(gap&&lastS[n]&&now-lastS[n]<gap)return;lastS[n]=now;
  switch(n){
    case 'shoot':tone(880+Math.random()*240,.07,'triangle',.045,.5);break;
    case 'hit':tone(180+Math.random()*60,.05,'square',.025,.6);break;
    case 'kill':noise(.13,.11,1400);tone(300+Math.random()*80,.08,'triangle',.03,.4);break;
    case 'pick':tone(620*Math.pow(1.035,Math.min(pickCombo,30)),.06,'sine',.06);break;
    case 'lvl':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.11),i*70));break;
    case 'hurt':tone(150,.22,'sawtooth',.13,.4);noise(.12,.08,900);break;
    case 'nova':noise(.45,.22,420);tone(95,.45,'sine',.28,.4);tone(1200,.12,'sine',.06,.3);break;
    case 'boss':tone(55,2,'sawtooth',.22,.6);tone(58,2,'sawtooth',.18,.6);noise(1.6,.2,220,'lowpass',.4);break;
    case 'heal':tone(440,.3,'sine',.12,2);break;
    case 'heart':[392,523,784].forEach((f,i)=>setTimeout(()=>tone(f,.28,'sine',.12),i*60));break;
    case 'explode':noise(.5,.26,600,'lowpass',.3);tone(70,.5,'sine',.3,.5);break;
    case 'telegraph':tone(660,.18,'square',.04,1.6);break;
    case 'dash':noise(.3,.14,1800,'bandpass',.3);break;
    case 'eclipse':tone(110,1.6,'sawtooth',.12,.5);noise(1.4,.12,300,'lowpass',.3);break;
    case 'over':tone(330,1.2,'triangle',.18,.25);break;
    case 'win':[392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.12),i*110));break;
  }
}
/* música: acordes com reverb, baixo, arpejo e percussão que crescem com a tensão; tema próprio para os chefes */
const PROG={calm:[[146.83,174.61,220],[116.54,146.83,174.61],[174.61,220,261.63],[130.81,164.81,196]],
            boss:[[146.83,174.61,220],[155.56,196,233.08],[146.83,174.61,220],[138.59,164.81,207.65]]};
function initMusic(){
  const out=AC.createGain();out.gain.value=.5;out.connect(master);
  const rev=AC.createConvolver(),len=Math.floor(AC.sampleRate*2.8),ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  rev.buffer=ir;const wet=AC.createGain();wet.gain.value=.6;rev.connect(wet);wet.connect(out);
  const dry=AC.createGain();dry.gain.value=.75;dry.connect(out);
  MUS={out,rev,dry,next:AC.currentTime+.15,step:0};
  setInterval(schedMusic,60);
}
function mvoice(t,f,d,type,vol,dest,cut){
  const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
  o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut||1800;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.5,d*.3));g.gain.setValueAtTime(vol,t+d*.6);g.gain.exponentialRampToValueAtTime(.0005,t+d);
  o.connect(fl);fl.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
}
function mperc(t,kind,vol){
  const g=AC.createGain();g.connect(MUS.dry);
  if(kind==='hat'){const s=AC.createBufferSource(),f=AC.createBiquadFilter();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+.05);s.connect(f);f.connect(g);s.start(t);s.stop(t+.06);return}
  const o=AC.createOscillator(),f0=kind==='kick'?120:190;o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(kind==='kick'?42:85,t+.22);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+.3);o.connect(g);o.start(t);o.stop(t+.32);
}
function schedMusic(){
  if(!AC||!MUS)return;
  if(save.mute||AC.state!=='running'){MUS.next=AC.currentTime+.1;return}
  const playing=state==='play'||state==='levelup'||state==='pause';
  const bossOn=playing&&boss&&!boss.dead;
  const mode=bossOn?'boss':'calm';
  const bpm=bossOn?104:(playing?84:68),st=60/bpm/2;
  const inten=playing?Math.min(1,time/480+enemies.length/380):.04;
  if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.05;
  while(MUS.next<AC.currentTime+.3){
    const tt=MUS.next,s=MUS.step%8,bar=Math.floor(MUS.step/8)%4,ch=PROG[mode][bar];
    if(s===0){
      ch.forEach(f=>{mvoice(tt,f,st*8.4,'triangle',.05,MUS.rev,700+inten*1100);mvoice(tt,f*1.004,st*8.4,'sawtooth',.012,MUS.rev,650)});
      if(inten>.15||bossOn)mvoice(tt,ch[0]/2,st*3.6,'sine',.17,MUS.dry,380);
    }
    if(s===4&&(inten>.3||bossOn))mvoice(tt,ch[0]/2,st*3,'sine',.13,MUS.dry,380);
    if(inten>.08||bossOn){const seq=[0,1,2,1,0,2,1,2];mvoice(tt,ch[seq[s]]*2,st*1.7,'sine',.026+inten*.022,MUS.rev,2600)}
    if(bossOn||inten>.45){if(s===0||s===4)mperc(tt,'kick',.42);if(bossOn&&(s===2||s===6))mperc(tt,'kick',.28)}
    if(bossOn||inten>.65){if(s%2===1)mperc(tt,'hat',.06)}
    if(bossOn&&s===7&&bar===3)mperc(tt,'tom',.3);
    MUS.next+=st;MUS.step++;
  }
}

  const pspd=P.speed*(inWeb?.55:1);

  P.flame-=P.burn*(.7+time/1100)*dt;P.inv-=dt;hurtFlash=Math.max(0,hurtFlash-dt);

  for(const g of gems){
    const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;

    if(d<P.r+8){
      g.dead=true;
      if(g.kind==='heal'){P.flame=Math.min(P.maxFlame,P.flame+40);sfx('heal');burst(P.x,P.y,16,'#ffd166',150,3,.5)}
      else if(g.kind==='heart'){P.flame=Math.min(P.maxFlame,P.flame+P.maxFlame*.5);sfx('heart');burst(P.x,P.y,22,'#ff3a3a',180,3,.6);ring(P.x,P.y,10,70,.35,'255,90,60',5)}
      else if(g.kind==='core'){if(P.lvl<MAX_LVL&&options()[0].id!=='heal')pendingLv+=2;else P.flame=Math.min(P.maxFlame,P.flame+P.maxFlame*.5);sfx('lvl')}
      else{if(P.lvl<MAX_LVL)P.xp+=g.v*P.xpMul;P.flame=Math.min(P.maxFlame,P.flame+g.v*(1.1+time/500));pickCombo++;pickT=.5;sfx('pick')}
    }
  }
  while(P.xp>=P.next&&P.lvl<MAX_LVL){P.xp-=P.next;P.lvl++;P.next=need(P.lvl);pendingLv++;if(P.lvl>=MAX_LVL){P.xp=0;setBanner(t('maxLvl'),2.6,t('maxLvlD'))}}

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=dt}
  for(const r of rings){r.life-=dt;const k=1-r.life/r.max;r.r=r.r0+(r.r1-r.r0)*(1-Math.pow(1-k,3))}
  for(const tx of texts){tx.y-=40*dt;tx.life-=dt}
  updAmb(dt);

  enemies=enemies.filter(e=>!e.dead);bullets=bullets.filter(b=>!b.dead);ebul=ebul.filter(b=>!b.dead);
  gems=gems.filter(g=>!g.dead);novas=novas.filter(n=>!n.dead);patches=patches.filter(p=>!p.dead);pools=pools.filter(p=>!p.dead);marks=marks.filter(m=>!m.dead);webs=webs.filter(w=>!w.dead);
  parts=parts.filter(p=>p.life>0);texts=texts.filter(x=>x.life>0);rings=rings.filter(r=>r.life>0);

  cam.x+=(P.x-cam.x)*Math.min(1,dt*10);cam.y+=(P.y-cam.y)*Math.min(1,dt*10);
  if(pendingLv>0)openLevelUp();
}
/* partículas de clima de cada mapa */
function updAmb(dt){
  const kind=MAPS[RC.map].amb,hw=W/2/Z,hh=H/2/Z;
  if(amb.length<36&&Math.random()<dt*14){
    const x=cam.x+(Math.random()*2-1)*hw,y=cam.y+(Math.random()*2-1)*hh;
    amb.push({x,y,vx:(Math.random()-.5)*12,vy:kind==='ember'?-30-Math.random()*30:kind==='dust'?6:(Math.random()-.5)*10,life:3+Math.random()*3,max:6,ph:Math.random()*6})
  }

  amb=amb.filter(a=>a.life>0&&Math.abs(a.x-cam.x)<hw*1.3&&Math.abs(a.y-cam.y)<hh*1.3);
}

let deferredPrompt=null;
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
function installMode(){
  if(isStandalone())return null;
  if(inFrame)return CONFIG.linkWeb?'web':null;
  if(deferredPrompt)return 'prompt';
  if(isIOS&&location.protocol==='https:')return 'ios';

}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(state==='menu')fillMenu()});

  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
async function doInstall(){
  const m=installMode();

let curOpts=[];
function options(){
  const pool=[],wc=Object.keys(P.weap).length,pc=Object.keys(P.pass).length;
  for(const id in UP){
    const u=UP[id],cur=u.w?(P.weap[id]?P.weap[id].l:0):(P.pass[id]||0);
    if(cur>=(u.w?u.max:PASS_MAX_L))continue;if(u.w&&!cur&&wc>=MAX_WEAP)continue;if(!u.w&&!cur&&pc>=MAX_PASS)continue;
    pool.push({id,cur,w:rnd()*(u.w?(cur?1.25:1.4):1)});
  }
  pool.sort((a,b)=>b.w-a.w);
  const o=pool.slice(0,3);if(!o.length)o.push({id:'heal',cur:0});return o;
}

/* ---------- fim da partida + ranking ---------- */
let lastRun=null,lastRank=null,curMode=null;
function endRun(win){
  won=win;state='over';joy.on=false;
  runAsh=Math.floor(time/8)+Math.floor(P.kills/20)+P.lvl*2+(win?50:0)+bossN*10;
  save.ash+=runAsh;
  if(time>save.best.time)save.best.time=Math.floor(time);
  if(P.kills>save.best.kills)save.best.kills=P.kills;
  const lim=runLimit();
  const r={score:calcScore(time,P.kills,P.lvl),time:Math.floor(time),kills:P.kills,lvl:P.lvl,win:!!win,date:Date.now(),v:CONFIG.version,lim:isFinite(lim)?lim:FULL_SECONDS};
  lastRun=r;lastRank=null;
  if(RC.mode==='daily'){if(!save.daily||save.daily.day!==RC.day)save.daily={day:RC.day,best:0,tries:0};save.daily.tries++;if(r.score>save.daily.best)save.daily.best=r.score}
  persist();sfx(win?'win':'over');
  const demoWin=win&&CONFIG.demo,demoMap=demoWin&&RC.mode==='normal'&&RC.map!=='floresta';
  $('overTitle').textContent=win?(CONFIG.demo&&RC.mode==='normal'?(demoMap?t('demoMapEnd'):t('winDemo')):t('winFull')):t('over');
  $('overText').textContent=win?(CONFIG.demo&&RC.mode==='normal'?(demoMap?t('demoMapEndText'):t('winText')):t('winFullText')):t('loseText');
  $('modeLine').textContent=RC.mode==='daily'?`${t('daily')} · ${fmtDay(RC.day)}`:`${FLAMES[RC.flame][LANG][0]} · ${MAPS[RC.map][LANG][0]} · ${MODES[RC.mode][LANG][0]}`;
  $('scoreVal').textContent=nf(r.score);$('recordTag').textContent='';
  $('stats').innerHTML=`<div>${t('time')}<b>${fmt(time)}</b></div><div>${t('kills')}<b>${P.kills}</b></div><div>${t('level')}<b>${P.lvl}</b></div><div>${t('ash')}<b>+${runAsh}</b></div>`;
  $('bSeeFull').style.display=CONFIG.demo?'inline-block':'none';
  $('bSeeFull').className=demoWin?'btn':'btn sec';
  $('bAgain').className=demoWin?'btn sec':'btn';
  $('bDiscord').style.display=CONFIG.linkDiscord?'inline-block':'none';
  $('nickErr').textContent='';$('boardList').innerHTML='';
  show('over');
  const mode=rankMode();curMode=mode;
  if(!mode){$('nickBox').style.display='none';$('boardBox').style.display='block';$('rankLine').textContent=t('noRankMode');return}
  if(!validRun(r)){$('nickBox').style.display='none';$('boardBox').style.display='block';$('rankLine').textContent=t('suspicious');showTop($('boardList'),mode);return}
  if(save.player&&save.tokens[save.player.toLowerCase()])submitRun(r,mode);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function boardHTML(rows,me,meRow){
  if(!rows.length)return `<li class="empty">${t('empty')}</li>`;
  const isMe=r=>me&&r.nick.toLowerCase()===me.toLowerCase();
  const line=(r,pos)=>`<li class="${pos===1?'first ':''}${isMe(r)?'me':''}"><span class="pos">${pos===1?'👑':'#'+pos}</span><span class="nk">${esc(r.nick)}</span><span class="sc">${nf(r.score)}</span><span class="tm">${fmt(r.time)}</span></li>`;
  let h=rows.map((r,i)=>line(r,i+1)).join('');
  if(meRow&&meRow.rank>rows.length)h+=`<li class="sep">⋯</li>`+line(meRow,meRow.rank);
  return h;
}
async function showTop(el,mode){

async function submitRun(run,mode){
  $('nickBox').style.display='none';$('boardBox').style.display='block';$('rankLine').textContent=t('saving');
  try{
    const tok=save.tokens[save.player.toLowerCase()];
    const r=await BOARD.submit(save.player,tok,run,mode);

      if(r&&r.error==='taken'){save.player=null;persist();showNickBox(mode);return}
      $('rankLine').textContent=t('suspicious');showTop($('boardList'),mode);return;
    }
    lastRank={rank:r.rank,mode};
    if(r.improved){$('recordTag').textContent=t('newRecord');sfx('win')}
    $('rankLine').textContent=t('rankPos')(r.rank,r.total)+(r.improved?'':` · ${t('yourBest')}: ${nf(r.best.score)}`);

    $('boardList').innerHTML=boardHTML(rows,save.player,Object.assign({nick:save.player,rank:r.rank},r.best));
    flushPending();
  }catch(e){
    save.pending=(save.pending||[]).concat([Object.assign({nick:save.player,mode},run)]).slice(-20);persist();
    $('rankLine').textContent=t('saveErr');
  }
}
async function flushPending(){
  if(!save.pending||!save.pending.length)return;

  save.pending=rest;persist();
}

  const sub=RC.mode==='daily'?`${t('daily').toUpperCase()} · ${fmtDay(RC.day)}`:`${FLAMES[RC.flame][LANG][0]} · ${MAPS[RC.map][LANG][0]}`.toUpperCase();
  g.fillStyle='#ff9a4d';g.font=`700 30px ${F}`;g.fillText(sub,540,180);
  g.fillStyle='#d9c8b4';g.font=`800 46px ${F}`;g.fillText(t('cardSurv'),540,720);
  g.shadowColor='#ff5a00';g.shadowBlur=40;g.fillStyle='#fff1c8';g.font=`900 170px ${F}`;g.fillText(fmt(r.time),540,880);g.shadowBlur=0;
  g.fillStyle='#ffcf70';g.font=`800 60px ${F}`;g.fillText(`${nf(r.score)} ${t('cardPts')}`,540,970);
  let y=1040;
  if(lastRank){const where=lastRank.mode.startsWith('daily:')?t('cardToday'):t('cardIn')(MAPS[mapOfMode(lastRank.mode)][LANG][0]);g.fillStyle='#ff9a4d';g.font=`800 44px ${F}`;g.fillText((lastRank.rank===1?'👑 ':'')+t('cardRank')(lastRank.rank,where),540,y);y+=64}
  g.fillStyle='#cdb9a3';g.font=`600 36px ${F}`;g.fillText(t('cardLine')(nf(r.kills),r.lvl),540,y);y+=62;
  if(save.player){g.fillStyle='#f4e9d8';g.font=`800 40px ${F}`;g.fillText('@'+save.player,540,y)}
  g.fillStyle='rgba(255,140,60,.18)';g.fillRect(0,CH-130,CW,130);
  g.fillStyle='#ffcf70';g.font=`900 44px ${F}`;g.fillText(t('cardAsk'),540,CH-72);
  const link=(CONFIG.linkWeb||CONFIG.linkFull||'').replace(/^https?:\/\//,'');
  g.fillStyle='#d9c8b4';g.font=`600 28px ${F}`;g.fillText(link||t('cardFree'),540,CH-28);
  return c;
}
async function shareRun(){
  if(!lastRun)return;
  const link=CONFIG.linkWeb||CONFIG.linkFull||(location.protocol.startsWith('http')&&!/127\.0\.0\.1|localhost/.test(location.hostname)?location.href:'');
  const txt=t('shareText')(fmt(lastRun.time),lastRun.kills)+(link?' '+link:'');
  const c=makeCard();
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));
  if(blob&&navigator.canShare){
    const file=new File([blob],'ultima-chama.png',{type:'image/png'});
    try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],text:txt});return}}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  if(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ultima-chama.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
  try{await navigator.clipboard.writeText(txt)}catch(e){}
  toast(t('imgSaved'));
}
function toast(msg,ms){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display='none',ms||2200)}

/* ---------- entrada ---------- */
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  keys[e.code]=true;
  if(e.code==='Escape'||e.code==='KeyP')togglePause();
  if(e.code==='KeyM'){initAudio();setMute(!save.mute)}
  if(state==='levelup'&&/^Digit[1-3]$/.test(e.code))pickCard(+e.code.slice(5)-1);
  if(e.code==='Enter'||e.code==='Space'){
    if(state==='menu'){e.preventDefault();initAudio();openSetup()}
    else if(state==='setup'){e.preventDefault();$('bGo').click()}
  }
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
// analógico: a base fica PARADA onde o dedo tocou; o miolo acompanha o dedo até a borda
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;initAudio();
  joy.on=true;joy.id=e.pointerId;joy.sx=e.clientX;joy.sy=e.clientY;joy.dx=0;joy.dy=0;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!joy.on||e.pointerId!==joy.id)return;
  const vx=e.clientX-joy.sx,vy=e.clientY-joy.sy,l=Math.hypot(vx,vy);
  if(l<4){joy.dx=joy.dy=0;return}
  const m=Math.min(1,l/50);joy.dx=vx/l*m;joy.dy=vy/l*m;
});
const joyEnd=e=>{if(e.pointerId===joy.id){joy.on=false;joy.dx=joy.dy=0}};
cv.addEventListener('pointerup',joyEnd);cv.addEventListener('pointercancel',joyEnd);
cv.addEventListener('contextmenu',e=>e.preventDefault());

$('bPlay').onclick=()=>{initAudio();openSetup()};
$('bDaily').onclick=startDaily;
$('bGo').onclick=()=>startRun({flame:save.sel.flame,map:save.sel.map,mode:save.sel.mode});
$('bSetupBack').onclick=toMenu;
$('bShop').onclick=()=>{initAudio();openShop()};
$('bShopBack').onclick=toMenu;
$('bFullMenu').onclick=()=>openBuy('menu');
$('bSeeFull').onclick=()=>openBuy('over');
$('bBuy').onclick=()=>CONFIG.linkFull&&window.open(CONFIG.linkFull,'_blank','noopener');
$('bBuyBack').onclick=backFromBuy;
$('bNotify').onclick=()=>openNotify('buy');
$('bNotifyBack').onclick=()=>{if(notifyFrom==='buy')openBuy();else toMenu()};

$('bSound').onclick=$('bSound2').onclick=()=>{initAudio();setMute(!save.mute)};
$('bResume').onclick=togglePause;
$('bQuit').onclick=toMenu;
$('pbtn').onclick=togglePause;
$('bReroll').onclick=()=>{if(P.rerolls>0&&state==='levelup'){P.rerolls--;lvlOpenAt=0;openLevelUp()}};
$('bAgain').onclick=()=>startRun(RC.mode==='daily'?{flame:'vela',map:'floresta',mode:'daily',day:todayUTC()}:{flame:RC.flame,map:RC.map,mode:RC.mode});
$('bMenu').onclick=toMenu;
$('bShare').onclick=shareRun;
$('bDiscord').onclick=()=>CONFIG.linkDiscord&&window.open(CONFIG.linkDiscord,'_blank','noopener');
$('bRank').onclick=()=>{initAudio();openRank(modeOfMap(save.sel.map))};
$('bRankBack').onclick=toMenu;
$('bSwitch').onclick=()=>{save.player=null;persist();toast(t('switched'));openRank('main')};
$('bSkip').onclick=()=>{$('nickBox').style.display='none';$('rankLine').textContent=t('noSave')};
$('nickForm').onsubmit=async e=>{
  e.preventDefault();
  let err;
  try{err=await claimNick($('nickIn').value)}catch(_){err='saveErr'}
  if(err){$('nickErr').textContent=t(err);$('nickIn').focus();return}
  $('nickErr').textContent='';$('nickIn').blur();
  if(lastRun&&curMode)submitRun(lastRun,curMode);
};
$('notifyForm').onsubmit=async e=>{
  e.preventDefault();
  const em=$('emailIn').value.trim(),m=$('notifyMsg');m.className='err';
  if(em.length>254||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){m.textContent=t('badEmail');return}
  if(!$('consentIn').checked){m.textContent=t('needConsent');return}
  if(!BOARD_ONLINE){m.textContent=t('offlineFeat');return}
  m.textContent=t('saving');
  try{
    const r=await BOARD.subscribe(em,LANG,CONFIG.demo?'demo':'full');
    if(r&&r.ok){save.subscribed=true;persist();m.className='err ok';m.textContent=t('thanks');$('emailIn').value='';$('consentIn').checked=false}
    else m.textContent=t('badEmail');
  }catch(_){m.textContent=t('saveErr')}
};

/* ---------- laço principal ---------- */
newRun();fillMenu();flushPending();
let last=performance.now();
function frame(now){
  let dt=Math.min(.033,(now-last)/1000);last=now;clock+=dt;
  if(slowmo>0){slowmo-=dt;dt*=.35}
  if(state==='play')update(dt);
  shake*=Math.pow(.004,dt);if(shake<.2)shake=0;
  flashA=Math.max(0,flashA-dt*1.6);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
