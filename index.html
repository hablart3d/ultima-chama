<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="A escuridão devora tudo. Sua chama é sua vida e sua luz. Jogo de sobrevivência grátis no navegador.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Última Chama</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f4e9d8}
canvas{display:block;width:100vw;height:100vh}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;background:rgba(4,0,8,.74);text-align:center;padding:16px;box-sizing:border-box;overflow-y:auto}
.screen.on{display:flex}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
#menu{background:radial-gradient(circle at 50% 55%,rgba(40,12,0,.35),rgba(2,0,6,.86) 60%)}
#buyS{background:radial-gradient(circle at 50% 30%,rgba(70,20,0,.55),rgba(2,0,6,.92) 65%)}
h1{font-size:clamp(40px,9vw,84px);margin:0 0 6px;letter-spacing:.03em;color:#ffcf70;text-shadow:0 0 18px #ff7a00,0 0 50px #ff3d00;line-height:1}
h2{font-size:clamp(26px,5vw,40px);margin:0 0 14px;color:#ffcf70;text-shadow:0 0 16px #ff5a00}
p{margin:6px 0;max-width:560px;line-height:1.45;color:#d9c8b4}
.small{font-size:13px;opacity:.7}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;padding:3px 8px;border:1px solid #ff8a3d;border-radius:20px;color:#ffb070;margin-bottom:14px}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(#ff9a1f,#ff4d00);color:#1d0900;border:0;border-radius:12px;padding:13px 22px;font-weight:800;font-size:18px;min-width:240px;margin:5px;box-shadow:0 0 22px rgba(255,90,0,.35)}
.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:#ffcf9a;border:1.5px solid rgba(255,140,60,.6);box-shadow:none;font-weight:700;font-size:16px}
.btn:disabled{opacity:.35;cursor:default}
.btn .sub{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:2px}
.col{display:flex;flex-direction:column;align-items:center;margin:12px 0}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:720px;width:100%}
.card{position:relative;flex:1 1 190px;max-width:220px;background:linear-gradient(#21122b,#140a1b);border:1.5px solid rgba(255,138,61,.35);border-radius:14px;padding:16px 14px 14px;text-align:left;color:#f4e9d8;display:flex;flex-direction:column;gap:6px}
.card:hover,.card:focus{border-color:#ffb347;outline:none;box-shadow:0 0 20px rgba(255,120,0,.3)}
.card .ic{font-size:30px;color:#ffb347;text-shadow:0 0 12px #ff6a00;line-height:1}
.card .nm{font-weight:800;font-size:18px}
.card .tg{font-size:12px;font-weight:700;letter-spacing:.08em;color:#ff9a4d}
.card .ds{font-size:14px;color:#cdb9a3;line-height:1.35}
.card .k{position:absolute;top:10px;right:12px;font-size:12px;opacity:.45}
.card.mini{flex:1 1 150px;max-width:210px;padding:12px;gap:4px}
.card.mini .nm{font-size:16px}
.card.mini .ds{font-size:13px}
.card.sel{border-color:#ffcf70;box-shadow:0 0 0 1.5px #ffcf70,0 0 22px rgba(255,140,0,.3)}
.card.locked{opacity:.62}
.card.locked .nm::after{content:" 🔒"}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:20px;background:#3a1a05;color:#ffb070;width:max-content}
.dot{width:30px;height:30px;border-radius:50%;display:inline-block}
.sect{width:100%;max-width:720px;margin:4px 0 10px}
.sect h3{margin:0 0 8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#cdb9a3;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:6px 20px;margin:2px 0 10px;font-size:13px;color:#cdb9a3}
.stats b{color:#f4e9d8;display:block;font-size:20px}
.score{margin:2px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#cdb9a3}
.score b{display:block;font-size:46px;line-height:1.1;color:#ffcf70;text-shadow:0 0 18px #ff5a00;letter-spacing:0}
.score em{display:block;font-style:normal;font-weight:900;color:#fff1a8;font-size:16px;letter-spacing:.14em;min-height:1.2em;text-shadow:0 0 12px #ff9a00}
.nickbox,.boardbox{width:100%;max-width:440px;margin:2px 0 6px}
#nickForm{display:flex;gap:8px;justify-content:center}
.txt{flex:1;min-width:0;width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:11px 12px;border-radius:10px;border:1.5px solid rgba(255,140,60,.6);background:#1a0f22;color:#fff4e6;user-select:text;-webkit-user-select:text;outline:none}
.txt:focus{border-color:#ffcf70;box-shadow:0 0 14px rgba(255,140,0,.3)}
#nickForm .btn{min-width:0;margin:0;padding:11px 18px;font-size:16px}
.err{color:#ff8a7a;min-height:1.2em;font-size:14px;margin:6px auto}
.err.ok{color:#9fe0a0}
.link{background:none;border:0;color:#cdb9a3;text-decoration:underline;font-size:14px;padding:4px}
.board{list-style:none;padding:0;margin:6px auto;width:100%;max-width:440px;text-align:left}
.board li{display:grid;grid-template-columns:42px 1fr auto 48px;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;font-size:15px}
.board li:nth-child(odd){background:rgba(40,20,50,.55)}
.board li.first{background:linear-gradient(90deg,rgba(255,190,60,.3),rgba(255,120,0,.08));color:#ffe08a;font-weight:800;font-size:16px}
.board li.me{box-shadow:inset 0 0 0 1.5px #ffb347}
.board li.sep,.board li.empty{display:block;text-align:center;background:none;opacity:.6;padding:2px}
.board li.empty{opacity:.8;padding:10px}
.board .pos{font-weight:800;color:#ff9a4d}
.board li.first .pos{font-size:19px}
.board .nk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-weight:800;font-variant-numeric:tabular-nums}
.board .tm{opacity:.7;text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;margin:0 0 8px}
.tab{background:transparent;border:1.5px solid rgba(255,140,60,.45);color:#ffcf9a;border-radius:20px;padding:7px 18px;font-weight:700}
.tab.on{background:#ff8a1f;color:#1d0900;border-color:#ff8a1f}
.feats{list-style:none;padding:0;margin:8px 0;width:100%;max-width:460px;text-align:left}
.feats li{padding:10px 12px;margin:7px 0;background:#1a0f22;border:1px solid rgba(255,138,61,.25);border-radius:10px;line-height:1.35}
.price{font-size:22px;font-weight:800;color:#ffcf70;margin:6px 0}
.chk{display:flex;gap:10px;align-items:flex-start;text-align:left;max-width:440px;margin:12px auto;font-size:14px;color:#d9c8b4;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:#ff8a1f}
#notifyForm{display:flex;flex-direction:column;align-items:center}
.shop{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px;background:#1a0f22;border:1px solid rgba(255,138,61,.25);border-radius:12px;padding:12px;text-align:left}
.row .tx{flex:1}
.row .nm{font-weight:800}
.row .ds{font-size:13px;color:#cdb9a3}
.pips{font-size:12px;color:#ff9a4d;letter-spacing:2px}
.row .btn{min-width:0;font-size:15px;padding:9px 14px;margin:0}
#over .col{flex-direction:row;flex-wrap:wrap;justify-content:center;max-width:560px}
#over .col .btn{min-width:200px}
#pbtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,140,60,.4);background:rgba(20,8,28,.6);color:#ffcf9a;font-size:18px;display:none;z-index:5}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a1405;color:#ffcf9a;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:86vw;text-align:center;line-height:1.4}
@media (max-width:520px){
  .card{max-width:100%;flex-basis:100%}
  .card.mini{flex:1 1 28%;max-width:none;padding:10px 8px;align-items:center;text-align:center}
  .card.mini .ds{display:none}
  .card.mini .nm{font-size:14px}
  .card.locked .nm::after{content:""}
  .btn{min-width:200px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pbtn" aria-label="pause">II</button>
<div id="toast"></div>

<div id="menu" class="screen on">
  <span class="badge" id="demoBadge">DEMO</span>
  <h1 data-t="title"></h1>
  <p data-t="tag"></p>
  <div class="col">
    <button class="btn" id="bPlay" data-t="play"></button>
    <button class="btn sec" id="bDaily"></button>
    <button class="btn sec" id="bRank" data-t="ranking"></button>
    <button class="btn sec" id="bShop" data-t="shop"></button>
    <button class="btn sec" id="bFullMenu"></button>
    <button class="btn sec" id="bInstall"></button>
    <button class="btn sec" id="bSound"></button>
  </div>
  <p class="small" data-t="how"></p>
  <p class="small" data-t="how2"></p>
  <p class="small" id="bestLine"></p>
  <p class="small" id="playerLine"></p>
  <p class="small" id="ver"></p>
</div>

<div id="setupS" class="screen">
  <h2 data-t="prepare"></h2>
  <div class="sect"><h3 data-t="flameSel"></h3><div class="cards" id="flameCards"></div></div>
  <div class="sect"><h3 data-t="mapSel"></h3><div class="cards" id="mapCards"></div></div>
  <div class="sect"><h3 data-t="modeSel"></h3><div class="cards" id="modeCards"></div></div>
  <div class="col">
    <button class="btn" id="bGo" data-t="play"></button>
    <button class="btn sec" id="bSetupBack" data-t="back"></button>
  </div>
</div>

<div id="buyS" class="screen">
  <span class="badge" data-t="locked"></span>
  <h2 data-t="fullTitle"></h2>
  <p data-t="fullTag"></p>
  <ul class="feats" id="featList"></ul>
  <div class="price" id="priceLine"></div>
  <div class="col">
    <button class="btn" id="bBuy"></button>
    <button class="btn sec" id="bNotify" data-t="notify"></button>
    <button class="btn sec" id="bBuyBack" data-t="back"></button>
  </div>
</div>

<div id="notifyS" class="screen">
  <h2 data-t="notify"></h2>
  <p data-t="notifyD"></p>
  <form id="notifyForm" class="nickbox">
    <input id="emailIn" class="txt" type="email" autocomplete="email" inputmode="email" maxlength="254">
    <label class="chk"><input type="checkbox" id="consentIn"><span data-t="consent"></span></label>
    <button class="btn" type="submit" data-t="send"></button>
  </form>
  <p class="err" id="notifyMsg"></p>
  <p class="small" data-t="privacy"></p>
  <div class="col"><button class="btn sec" id="bNotifyBack" data-t="back"></button></div>
</div>

<div id="shopS" class="screen">
  <h2 data-t="shop"></h2>
  <p id="ashLine"></p>
  <div class="shop" id="shopList"></div>
  <button class="btn sec" id="bShopBack" data-t="back"></button>
</div>

<div id="rankS" class="screen">
  <h2 data-t="ranking"></h2>
  <div class="tabs"><button class="tab" id="tabMain" data-t="tabMain"></button><button class="tab" id="tabDaily" data-t="tabDaily"></button></div>
  <p id="rankMe"></p>
  <ol id="rankList" class="board"></ol>
  <p class="small" id="rankNote"></p>
  <div class="col">
    <button class="btn sec" id="bSwitch" data-t="switchP"></button>
    <button class="btn sec" id="bRankBack" data-t="back"></button>
  </div>
</div>

<div id="lvl" class="screen">
  <h2 data-t="choose"></h2>
  <div class="cards" id="cards"></div>
  <div class="col"><button class="btn sec" id="bReroll"></button></div>
</div>

<div id="pause" class="screen">
  <h2 data-t="paused"></h2>
  <div class="col">
    <button class="btn" id="bResume" data-t="resume"></button>
    <button class="btn sec" id="bSound2"></button>
    <button class="btn sec" id="bQuit" data-t="menu"></button>
  </div>
</div>

<div id="over" class="screen">
  <h2 id="overTitle"></h2>
  <p class="small" id="modeLine"></p>
  <p id="overText"></p>
  <div class="score"><span data-t="score"></span><b id="scoreVal"></b><em id="recordTag"></em></div>
  <div class="stats" id="stats"></div>
  <div id="nickBox" class="nickbox">
    <p data-t="yourNick"></p>
    <form id="nickForm"><input id="nickIn" class="txt" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" type="submit" data-t="save"></button></form>
    <p class="err" id="nickErr"></p>
    <button class="link" id="bSkip" type="button" data-t="skip"></button>
  </div>
  <div id="boardBox" class="boardbox">
    <p id="rankLine"></p>
    <ol id="boardList" class="board"></ol>
  </div>
  <div class="col">
    <button class="btn sec" id="bSeeFull" data-t="seeFull"></button>
    <button class="btn" id="bAgain" data-t="again"></button>
    <button class="btn sec" id="bShare" data-t="share"></button>
    <button class="btn sec" id="bDiscord" data-t="discord"></button>
    <button class="btn sec" id="bMenu" data-t="menu"></button>
  </div>
</div>

function checkNick(n){
  if(!/^[A-Za-z0-9_.\-À-ÖØ-öø-ÿ]{3,16}$/.test(n))return 'invalid';
  const z=normNick(n);if(BAD.some(w=>z.includes(w.replace(/(.)\1+/g,'$1'))))return 'offensive';

}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}

let AC=null,master=null,noiseBuf=null,pickCombo=0,pickT=0,musicT=2;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=save.mute?0:.5;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
    const g=AC.createGain();g.gain.value=.05;f.connect(g);g.connect(master);
    [55,82.4,110.3].forEach((fr,i)=>{const o=AC.createOscillator();o.type=i?'triangle':'sine';o.frequency.value=fr;o.detune.value=(i-1)*6;o.connect(f);o.start()});
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=160;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
  }catch(e){AC=null}
}
function tone(fr,dur,type,vol,slide){
  if(!AC)return;const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(fr,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,fr*slide),t0+dur);
  g.gain.setValueAtTime(vol||.1,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);
}
function noise(dur,vol,fc){
  if(!AC)return;const t0=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=fc;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur);
}

function sfx(n){
  if(!AC||save.mute)return;const now=AC.currentTime;
  const gap={shoot:.06,hit:.04,kill:.035,pick:.03}[n]||0;
  if(gap&&lastS[n]&&now-lastS[n]<gap)return;lastS[n]=now;
  switch(n){
    case 'shoot':tone(880+Math.random()*240,.07,'triangle',.045,.5);break;
    case 'hit':tone(180+Math.random()*60,.05,'square',.025,.6);break;
    case 'kill':noise(.13,.11,1400);break;
    case 'pick':tone(620*Math.pow(1.035,Math.min(pickCombo,30)),.06,'sine',.06);break;
    case 'lvl':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.11),i*70));break;
    case 'hurt':tone(150,.22,'sawtooth',.13,.4);break;
    case 'nova':noise(.45,.22,420);tone(95,.45,'sine',.28,.4);break;
    case 'boss':tone(55,1.6,'sawtooth',.22,.7);tone(58,1.6,'sawtooth',.18,.7);break;
    case 'heal':tone(440,.3,'sine',.12,2);break;
    case 'over':tone(330,1.2,'triangle',.18,.25);break;

}

const CELL=64;const grid=new Map();
const gk=(cx,cy)=>(cx+32768)*65536+(cy+32768);
function buildGrid(){
  grid.clear();
  for(const e of enemies){if(e.dead)continue;const k=gk(Math.floor(e.x/CELL),Math.floor(e.y/CELL));let a=grid.get(k);if(!a){a=[];grid.set(k,a)}a.push(e)}
}
function query(x,y,r,fn){
  const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get(gk(cx,cy));if(a)for(const e of a)if(!e.dead)fn(e)}
}

/* ---------- criação ---------- */
function spawnEnemy(type,x,y){
  if(type!=='boss'&&enemies.length>=480)return null;
  const d=ET[type];
  if(x===undefined){const a=rnd()*Math.PI*2,dist=viewRadius()+50;x=P.x+Math.cos(a)*dist;y=P.y+Math.sin(a)*dist}
  const hm=1+time/150+(time>300?(time-300)/90:0);
  const e={type,x,y,r:d.r,hp:d.hp*hm,maxhp:d.hp*hm,spd:d.spd*(.9+rnd()*.2),dmg:d.dmg,xp:d.xp,flash:0,kx:0,ky:0,ph:rnd()*6.28,shot:1.5+rnd()*2,orbT:0,dead:false};
  enemies.push(e);return e;
}
function pickType(){
  const b=MAPS[RC.map].bias,r=rnd(),wB=b.wisp||0,bB=b.brute||0,cB=b.crawler||0;
  if(time>(b.wispEarly?120:200)&&r<.12+wB)return 'wisp';
  if(time>120&&r<.24+wB+bB)return 'brute';
  if(time>45&&r<.46+wB+bB+cB)return 'crawler';
  return 'shade';
}
function burst(x,y,n,c,spd,size,life){
  for(let i=0;i<n&&parts.length<600;i++){const a=Math.random()*6.283,s=spd*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*(.6+Math.random()*.6),max:life,c,s:size*(.6+Math.random()*.8)})}
}
function addGem(x,y,v){
  if(gems.length>350){const i=gems.findIndex(g=>!g.heal&&!g.core);if(i>=0){v+=gems[i].v;gems.splice(i,1)}}
  gems.push({x,y,v,pull:false,sp:0});
}
function setBanner(txt,dur){banner={txt,t:dur||2.6,max:dur||2.6}}

/* ---------- combate ---------- */
function hitEnemy(e,dmg,kx,ky,quiet){
  if(e.dead)return;
  const crit=rnd()<.08;if(crit)dmg*=2;
  e.hp-=dmg;e.flash=.09;
  if(e.type!=='boss'){e.kx+=kx;e.ky+=ky}
  if(texts.length<90)texts.push({x:e.x+(Math.random()-.5)*10,y:e.y-e.r,v:Math.round(dmg),life:.6,crit});
  if(!quiet)sfx('hit');
  if(e.hp<=0)kill(e);
}
function kill(e){
  e.dead=true;P.kills++;sfx('kill');
  burst(e.x,e.y,e.type==='boss'?70:7,'#ff8a3d',e.type==='boss'?260:140,3,.5);
  burst(e.x,e.y,e.type==='boss'?40:5,'#4a2c66',90,4,.7);
  if(e.type==='boss'){
    boss=null;shake=Math.min(22,shake+14);setBanner(t('bossDown'));
    for(let i=0;i<30;i++)addGem(e.x+(rnd()-.5)*120,e.y+(rnd()-.5)*120,3);
    gems.push({x:e.x,y:e.y,v:0,core:true,pull:false,sp:0});return;
  }
  addGem(e.x,e.y,e.xp);
  if(rnd()<.012)gems.push({x:e.x,y:e.y,v:0,heal:true,pull:false,sp:0});
}
function hurt(d){
  P.flame-=d;P.inv=.5;shake=Math.min(16,shake+6);hurtFlash=.3;sfx('hurt');
  burst(P.x,P.y,10,'#ff5a00',160,3,.4);
}
function nearestN(n,maxR){
  const m2=maxR*maxR,list=[];
  for(const e of enemies){if(e.dead)continue;const dx=e.x-P.x,dy=e.y-P.y,d=dx*dx+dy*dy;if(d<m2)list.push([d,e])}
  list.sort((a,b)=>a[0]-b[0]);return list.slice(0,n).map(a=>a[1]);
}
function weapons(dt){
  for(const id in P.weap){
    const st=P.weap[id],s=wstat(id,st.l);
    if(id==='spark'){
      st.t-=dt;
      if(st.t<=0){
        const tg=nearestN(s.n,lightR()+20);
        if(tg.length){
          st.t=s.cd*P.cdMul;
          for(let i=0;i<s.n;i++){const e=tg[i%tg.length];const a=Math.atan2(e.y-P.y,e.x-P.x)+(i>=tg.length?(rnd()-.5)*.4:0);
            bullets.push({x:P.x,y:P.y,vx:Math.cos(a)*s.spd,vy:Math.sin(a)*s.spd,dmg:s.dmg*P.dmgMul,pierce:s.pierce,life:1.1,hit:new Set(),r:5*P.area,dead:false})}
          sfx('shoot');
        }else st.t=.1;
      }
    }else if(id==='aura'){
      st.t-=dt;const r=s.r*P.area;st.r=r;
      if(st.t<=0){st.t=s.tick;query(P.x,P.y,r+50,e=>{if(Math.hypot(e.x-P.x,e.y-P.y)<r+e.r)hitEnemy(e,s.dmg*P.dmgMul,0,0,true)})}
    }else if(id==='orbit'){
      st.a=(st.a||0)+s.spd*dt;st.pos=[];const R=s.r*P.area,hr=10*P.area;
      for(let i=0;i<s.n;i++){
        const a=st.a+i*6.283/s.n,ox=P.x+Math.cos(a)*R,oy=P.y+Math.sin(a)*R;st.pos.push([ox,oy,hr]);
        query(ox,oy,hr+50,e=>{if(e.orbT>time)return;const dx=e.x-ox,dy=e.y-oy;if(dx*dx+dy*dy<(e.r+hr)*(e.r+hr)){e.orbT=time+.3;const d=Math.hypot(e.x-P.x,e.y-P.y)||1;hitEnemy(e,s.dmg*P.dmgMul,(e.x-P.x)/d*160,(e.y-P.y)/d*160)}});
      }
    }else if(id==='nova'){
      st.t=(st.t===undefined?1:st.t)-dt;
      if(st.t<=0){st.t=s.cd*P.cdMul;novas.push({x:P.x,y:P.y,r:10,max:s.r*P.area,dmg:s.dmg*P.dmgMul,hit:new Set()});sfx('nova');shake=Math.min(16,shake+3)}
    }else if(id==='trail'){
      st.t-=dt;
      if(moving&&st.t<=0){st.t=.22;patches.push({x:P.x,y:P.y,r:s.r*P.area,life:s.dur,max:s.dur,dmg:s.dmg*P.dmgMul,tick:0})}
    }
  }
}

/* ---------- atualização ---------- */
function update(dt){
  time+=dt;
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let iy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(joy.on){ix=joy.dx;iy=joy.dy}
  const len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}
  moving=len>.15;
  P.x+=ix*P.speed*dt;P.y+=iy*P.speed*dt;
  P.flame-=P.burn*(1+time/900)*dt;P.inv-=dt;hurtFlash=Math.max(0,hurtFlash-dt);
  if(P.flame<=0){endRun(false);return}
  if(RC.mode!=='endless'&&time>=RUN_SECONDS){endRun(true);return}
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null}

  const vr=viewRadius();
  spawnAcc+=dt*(.7+time/45+(time>300?(time-300)/30:0));
  while(spawnAcc>=1){spawnAcc--;spawnEnemy(pickType())}
  if(time>=nextSwarm){
    nextSwarm+=60;const n=14+Math.floor(time/12);
    for(let i=0;i<n;i++){const a=i/n*6.283;spawnEnemy(time>240?'crawler':'shade',P.x+Math.cos(a)*(vr+30),P.y+Math.sin(a)*(vr+30))}
    setBanner(t('swarm'),2);
  }
  if(time>=nextBoss&&!boss){
    nextBoss+=180;bossN++;const a=rnd()*6.283;
    boss=spawnEnemy('boss',P.x+Math.cos(a)*(vr+60),P.y+Math.sin(a)*(vr+60));
    boss.hp=boss.maxhp=1400*(1+(bossN-1)*1.2);
    setBanner(t('boss'),3);sfx('boss');shake=Math.min(20,shake+10);
  }

  buildGrid();
  weapons(dt);

  for(const e of enemies){
    if(e.dead)continue;
    e.flash-=dt;
    let dx=P.x-e.x,dy=P.y-e.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    let mx=dx,my=dy;
    if(e.type==='wisp'){
      if(d<170){mx=-dx;my=-dy}else if(d<240){mx=-dy;my=dx}
      e.shot-=dt;if(e.shot<=0&&d<vr){e.shot=2.6;ebul.push({x:e.x,y:e.y,vx:dx*170,vy:dy*170,life:4})}
    }else if(e.type==='boss'){
      e.shot-=dt;if(e.shot<=0){e.shot=6;for(let i=0;i<6;i++){const a=i/6*6.283;spawnEnemy('crawler',e.x+Math.cos(a)*75,e.y+Math.sin(a)*75)}}
    }
    e.x+=(mx*e.spd+e.kx)*dt;e.y+=(my*e.spd+e.ky)*dt;
    const damp=Math.max(0,1-dt*7);e.kx*=damp;e.ky*=damp;
    if(e.type!=='boss')query(e.x,e.y,e.r+50,o=>{
      if(o===e)return;const ox=e.x-o.x,oy=e.y-o.y,dd=ox*ox+oy*oy,rr=e.r+o.r;
      if(dd<rr*rr&&dd>.01){const dl=Math.sqrt(dd),push=(rr-dl)*(o.type==='boss'?.9:.45);e.x+=ox/dl*push;e.y+=oy/dl*push}
    });
    if(d<e.r+P.r&&P.inv<=0)hurt(e.dmg*(1+time/600));
    if(d>vr*1.9&&e.type!=='boss'){
      const a=(moving?Math.atan2(iy,ix):rnd()*6.283)+(rnd()-.5)*1.6;
      e.x=P.x+Math.cos(a)*(vr+40);e.y=P.y+Math.sin(a)*(vr+40);
    }
  }

  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0)b.dead=true;
    if(!b.dead)query(b.x,b.y,b.r+50,e=>{
      if(b.dead||b.hit.has(e))return;const dx=e.x-b.x,dy=e.y-b.y;
      if(dx*dx+dy*dy<(e.r+b.r)*(e.r+b.r)){b.hit.add(e);hitEnemy(e,b.dmg,b.vx*.12,b.vy*.12);if(b.pierce--<=0)b.dead=true}
    });
  }
  for(const n of novas){
    n.r+=540*dt;
    query(n.x,n.y,n.r+40,e=>{if(n.hit.has(e))return;const d=Math.hypot(e.x-n.x,e.y-n.y);if(d<n.r+e.r){n.hit.add(e);hitEnemy(e,n.dmg,(e.x-n.x)/(d||1)*260,(e.y-n.y)/(d||1)*260)}});
    if(n.r>=n.max)n.dead=true;
  }
  for(const p of patches){
    p.life-=dt;p.tick-=dt;if(p.life<=0)p.dead=true;
    if(p.tick<=0){p.tick=.4;query(p.x,p.y,p.r+50,e=>{if(Math.hypot(e.x-p.x,e.y-p.y)<p.r+e.r)hitEnemy(e,p.dmg,0,0,true)})}
  }
  for(const b of ebul){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0)b.dead=true;
    if(!b.dead&&Math.hypot(b.x-P.x,b.y-P.y)<P.r+7){b.dead=true;P.flame-=7*(1+time/600);hurtFlash=.25;sfx('hurt');burst(b.x,b.y,8,'#7a40ff',120,3,.4)}
  }

  pickT-=dt;if(pickT<=0)pickCombo=0;
  for(const g of gems){
    const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;
    if(d<P.magnet||g.pull){g.pull=true;g.sp=(g.sp||120)+900*dt;g.x+=dx/d*g.sp*dt;g.y+=dy/d*g.sp*dt}
    if(d<P.r+8){
      g.dead=true;
      if(g.heal){P.flame=Math.min(P.maxFlame,P.flame+40);sfx('heal');burst(P.x,P.y,16,'#ffd166',150,3,.5)}
      else if(g.core){pendingLv+=2;sfx('lvl')}
      else{P.xp+=g.v*P.xpMul;P.flame=Math.min(P.maxFlame,P.flame+.6*g.v);pickCombo++;pickT=.5;sfx('pick')}
    }
  }
  while(P.xp>=P.next){P.xp-=P.next;P.lvl++;P.next=need(P.lvl);pendingLv++}

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=dt}
  for(const tx of texts){tx.y-=40*dt;tx.life-=dt}

  enemies=enemies.filter(e=>!e.dead);bullets=bullets.filter(b=>!b.dead);ebul=ebul.filter(b=>!b.dead);
  gems=gems.filter(g=>!g.dead);novas=novas.filter(n=>!n.dead);patches=patches.filter(p=>!p.dead);
  parts=parts.filter(p=>p.life>0);texts=texts.filter(x=>x.life>0);

  cam.x+=(P.x-cam.x)*Math.min(1,dt*10);cam.y+=(P.y-cam.y)*Math.min(1,dt*10);
  if(pendingLv>0)openLevelUp();
}

/* ---------- desenho ---------- */
function hash(a,b){let h=Math.imul(a,374761393)+Math.imul(b,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0}
function drawGround(cx,cy){
  const G=160,hw=W/2/Z,hh=H/2/Z,pal=MAPS[RC.map].pal;
  const x0=Math.floor((cx-hw)/G)-1,x1=Math.floor((cx+hw)/G)+1,y0=Math.floor((cy-hh)/G)-1,y1=Math.floor((cy+hh)/G)+1;
  for(let gx=x0;gx<=x1;gx++)for(let gy=y0;gy<=y1;gy++){
    let h=hash(gx,gy);const r=()=>{h=(Math.imul(h,1664525)+1013904223)>>>0;return h/4294967296};
    if(r()<.3){ctx.fillStyle=pal.patch;ctx.beginPath();ctx.ellipse(gx*G+r()*G,gy*G+r()*G,40+r()*60,25+r()*35,r()*3,0,6.283);ctx.fill()}
    const n=Math.floor(r()*4);
    for(let i=0;i<n;i++){
      const px=gx*G+r()*G,py=gy*G+r()*G,k=r();
      if(k<.5){ctx.fillStyle=pal.stone;ctx.beginPath();ctx.ellipse(px,py,4+r()*8,3+r()*5,0,0,6.283);ctx.fill()}
      else if(k<.88){ctx.strokeStyle=pal.grass;ctx.lineWidth=2;ctx.beginPath();for(let j=0;j<3;j++){ctx.moveTo(px+j*4-4,py);ctx.lineTo(px+j*5-6+r()*4,py-8-r()*8)}ctx.stroke()}
      else{ctx.strokeStyle=pal.rune;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px-7,py);ctx.lineTo(px+7,py);ctx.moveTo(px,py-9);ctx.lineTo(px,py+5);ctx.stroke()}
    }
  }
}
function ghostPath(x,y,r,ph){
  ctx.moveTo(x-r,y);ctx.arc(x,y,r,Math.PI,0);
  for(let i=0;i<=4;i++){const px=x+r-2*r*i/4,py=y+r*.95+Math.sin(ph+i*1.7)*r*.18*(i%2?1:-1);ctx.lineTo(px,py)}
  ctx.closePath();
}
function diamondPath(x,y,r,ph){const s=Math.sin(ph)*.15;ctx.moveTo(x,y-r*(1.2+s));ctx.lineTo(x+r,y);ctx.lineTo(x,y+r*(1.2-s));ctx.lineTo(x-r,y);ctx.closePath()}
function flameShape(x,y,w,h,fl,c){
  c=c||ctx;c.beginPath();c.moveTo(x-w,y);
  c.quadraticCurveTo(x-w,y-h*.55,x+fl,y-h);
  c.quadraticCurveTo(x+w,y-h*.55,x+w,y);
  c.arc(x,y,w,0,Math.PI);c.fill();
}
function drawPlayer(){
  const f=Math.max(0,P.flame)/P.maxFlame,fl=Math.sin(clock*18)*2+Math.sin(clock*31)*1.2,fc=FLAMES[RC.flame].color;
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(P.x,P.y,0,P.x,P.y,70);g.addColorStop(0,'rgba(255,130,30,.45)');g.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle=g;ctx.fillRect(P.x-70,P.y-70,140,140);
  ctx.globalCompositeOperation='source-over';
  if(P.inv>0&&Math.floor(clock*20)%2)ctx.globalAlpha=.45;
  const h=26+14*f,s=RC.flame==='fogueira'?1.2:RC.flame==='tocha'?.92:1;
  ctx.fillStyle=fc[0];flameShape(P.x,P.y+4,13*s,h*s,fl);
  ctx.fillStyle=fc[1];flameShape(P.x,P.y+4,9.5*s,h*.72*s,fl*.7);
  ctx.fillStyle=fc[2];flameShape(P.x,P.y+4,5.5*s,h*.42*s,fl*.4);
  ctx.fillStyle='#3a1500';ctx.beginPath();ctx.arc(P.x-3.5,P.y-1,1.8,0,6.283);ctx.arc(P.x+3.5,P.y-1,1.8,0,6.283);ctx.fill();
  ctx.globalAlpha=1;
}
function addLight(x,y,r,a){
  const g=dctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(.55,`rgba(0,0,0,${a*.75})`);g.addColorStop(1,'rgba(0,0,0,0)');
  dctx.fillStyle=g;dctx.fillRect(x-r,y-r,r*2,r*2);
}
function render(){
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  const cx=cam.x+sx,cy=cam.y+sy,pal=MAPS[RC.map].pal;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=pal.bg;ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*Z,0,0,DPR*Z,DPR*(W/2-cx*Z),DPR*(H/2-cy*Z));
  drawGround(cx,cy);

  ctx.globalCompositeOperation='lighter';
  for(const p of patches){const a=Math.min(1,p.life/p.max*1.5)*.55;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(255,140,30,${a})`);g.addColorStop(1,'rgba(255,40,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}
  if(P.weap.aura&&P.weap.aura.r){const r=P.weap.aura.r;ctx.fillStyle='rgba(255,90,0,.07)';ctx.beginPath();ctx.arc(P.x,P.y,r,0,6.283);ctx.fill();ctx.strokeStyle=`rgba(255,140,40,${.18+Math.sin(clock*6)*.06})`;ctx.lineWidth=2;ctx.stroke()}
  ctx.globalCompositeOperation='source-over';

  for(const type in ET){
    const d=ET[type];ctx.beginPath();let any=false;
    for(const e of enemies){if(e.type!==type||e.flash>0)continue;any=true;type==='wisp'?diamondPath(e.x,e.y,e.r,clock*5+e.ph):ghostPath(e.x,e.y,e.r,clock*5+e.ph)}
    if(any){ctx.fillStyle=d.body;ctx.fill();ctx.strokeStyle='rgba(255,150,80,.22)';ctx.lineWidth=1.5;ctx.stroke()}
  }
  ctx.beginPath();let anyF=false;
  for(const e of enemies){if(e.flash>0){anyF=true;e.type==='wisp'?diamondPath(e.x,e.y,e.r,0):ghostPath(e.x,e.y,e.r,clock*5+e.ph)}}
  if(anyF){ctx.fillStyle='#ffe2c4';ctx.fill()}

  ctx.globalCompositeOperation='lighter';
  for(const n of novas){const a=1-n.r/n.max;ctx.strokeStyle=`rgba(255,140,40,${.25+a*.6})`;ctx.lineWidth=4+a*12;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,6.283);ctx.stroke()}
  ctx.fillStyle='#ffd166';
  for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill()}
  ctx.strokeStyle='rgba(255,170,60,.5)';ctx.lineWidth=3;ctx.beginPath();
  for(const b of bullets){ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.04,b.y-b.vy*.04)}ctx.stroke();
  const orb=P.weap.orbit;
  if(orb&&orb.pos)for(const [ox,oy,hr] of orb.pos){const g=ctx.createRadialGradient(ox,oy,0,ox,oy,hr*2.4);g.addColorStop(0,'rgba(255,230,160,1)');g.addColorStop(.4,'rgba(255,140,30,.8)');g.addColorStop(1,'rgba(255,60,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ox,oy,hr*2.4,0,6.283);ctx.fill()}
  ctx.globalCompositeOperation='source-over';

  drawPlayer();
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
  ctx.globalAlpha=1;

  // escuridão
  const k=dark.width/W;
  dctx.setTransform(1,0,0,1,0,0);dctx.globalCompositeOperation='source-over';
  dctx.clearRect(0,0,dark.width,dark.height);dctx.fillStyle=pal.dark;dctx.fillRect(0,0,dark.width,dark.height);
  dctx.globalCompositeOperation='destination-out';
  dctx.setTransform(k*Z,0,0,k*Z,k*(W/2-cx*Z),k*(H/2-cy*Z));
  const lr=lightR()*(1+Math.sin(clock*13)*.015+Math.sin(clock*7.3)*.012);
  addLight(P.x,P.y,lr,1);
  for(const b of bullets)addLight(b.x,b.y,45,.8);
  if(orb&&orb.pos)for(const [ox,oy] of orb.pos)addLight(ox,oy,60,.8);
  for(const p of patches)addLight(p.x,p.y,p.r*2.4,.6*Math.min(1,p.life/p.max*1.5));
  for(const n of novas)addLight(n.x,n.y,n.r+40,.55*(1-n.r/n.max));
  for(const g of gems)if(g.heal||g.core)addLight(g.x,g.y,50,.7);
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(dark,0,0,cv.width,cv.height);

  // o que brilha no escuro
  ctx.setTransform(DPR*Z,0,0,DPR*Z,DPR*(W/2-cx*Z),DPR*(H/2-cy*Z));
  for(const type in ET){
    const d=ET[type];const glow=[],core=[];
    for(const e of enemies){if(e.type!==type)continue;
      const a=Math.atan2(P.y-e.y,P.x-e.x),ex=e.x+Math.cos(a)*e.r*.25,ey=e.y-e.r*.12+Math.sin(a)*e.r*.15,s=Math.max(1.8,e.r*.13),o=e.r*.33;
      glow.push(ex-o,ey,s*2.6,ex+o,ey,s*2.6);core.push(ex-o,ey,s,ex+o,ey,s)}
    if(!glow.length)continue;
    ctx.globalAlpha=.28;ctx.fillStyle=d.eye;ctx.beginPath();for(let i=0;i<glow.length;i+=3){ctx.moveTo(glow[i]+glow[i+2],glow[i+1]);ctx.arc(glow[i],glow[i+1],glow[i+2],0,6.283)}ctx.fill();
    ctx.globalAlpha=1;ctx.beginPath();for(let i=0;i<core.length;i+=3){ctx.moveTo(core[i]+core[i+2],core[i+1]);ctx.arc(core[i],core[i+1],core[i+2],0,6.283)}ctx.fill();
  }
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(255,140,40,.3)';ctx.beginPath();
  for(const g of gems)if(!g.heal&&!g.core){const r=g.v>2?9:6;ctx.moveTo(g.x+r,g.y);ctx.arc(g.x,g.y,r,0,6.283)}ctx.fill();
  ctx.fillStyle='#ffd27a';ctx.beginPath();
  for(const g of gems)if(!g.heal&&!g.core){const r=g.v>2?3.8:2.6;ctx.moveTo(g.x+r,g.y);ctx.arc(g.x,g.y,r,0,6.283)}ctx.fill();
  ctx.fillStyle='rgba(150,80,255,.45)';ctx.beginPath();for(const b of ebul){ctx.moveTo(b.x+11,b.y);ctx.arc(b.x,b.y,11,0,6.283)}ctx.fill();
  ctx.fillStyle='#d8c0ff';ctx.beginPath();for(const b of ebul){ctx.moveTo(b.x+4,b.y);ctx.arc(b.x,b.y,4,0,6.283)}ctx.fill();
  ctx.globalCompositeOperation='source-over';
  for(const g of gems){
    if(g.heal){const p=1+Math.sin(clock*6)*.12;ctx.fillStyle='#ffb347';flameShape(g.x,g.y+5,7*p,20*p,0);ctx.fillStyle='#fff0bf';flameShape(g.x,g.y+5,3.5*p,11*p,0)}
    if(g.core){const p=1+Math.sin(clock*5)*.15;ctx.fillStyle='#ff4d00';ctx.beginPath();ctx.arc(g.x,g.y,14*p,0,6.283);ctx.fill();ctx.fillStyle='#fff0bf';ctx.beginPath();ctx.arc(g.x,g.y,6*p,0,6.283);ctx.fill()}
  }
  ctx.textAlign='center';
  for(const x of texts){ctx.globalAlpha=Math.min(1,x.life*2.5);ctx.font=x.crit?'800 17px system-ui,sans-serif':'700 13px system-ui,sans-serif';ctx.fillStyle=x.crit?'#ffe066':'#fff4e6';ctx.fillText(x.v,x.x,x.y)}
  ctx.globalAlpha=1;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(state==='play'||state==='levelup'||state==='pause')drawHUD();
}

    ctx.fillStyle='#ffb347';ctx.font='15px system-ui,sans-serif';ctx.fillText(UP[id].icon,x,y+1);ctx.font='700 10px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(P.weap[id].l,x+11,y+11);i++}

  ctx.fillStyle='rgba(20,8,24,.85)';ctx.fillRect(bx-2,by-2,bw+4,18);
  const g=ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#ff3d00');g.addColorStop(1,'#ffd166');
  ctx.fillStyle=f<.3&&Math.floor(clock*6)%2?'#ff2a00':g;ctx.fillRect(bx,by,bw*f,14);
  ctx.fillStyle='#fff4e6';ctx.font='800 11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(`${t('flame')} ${Math.ceil(Math.max(0,P.flame))}/${P.maxFlame}`,W/2,by+7.5);

  if(joy.on&&state==='play'){ctx.strokeStyle='rgba(255,200,150,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.sx,joy.sy,50,0,6.283);ctx.stroke();ctx.fillStyle='rgba(255,170,90,.35)';ctx.beginPath();ctx.arc(joy.sx+joy.dx*50,joy.sy+joy.dy*50,20,0,6.283);ctx.fill()}

/* ---------- instalar no celular (PWA) ---------- */
let deferredPrompt=null;
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
function installMode(){
  if(isStandalone())return null;
  if(inFrame)return CONFIG.linkWeb?'web':null;
  if(deferredPrompt)return 'prompt';
  if(isIOS&&location.protocol==='https:')return 'ios';
  return null;
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(state==='menu')fillMenu()});
addEventListener('appinstalled',()=>{deferredPrompt=null;if(state==='menu')fillMenu()});
if('serviceWorker' in navigator&&!inFrame&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
async function doInstall(){
  const m=installMode();

  else if(m==='ios')toast(t('iosHint'),6000);
  else if(m==='web')window.open(CONFIG.linkWeb,'_blank','noopener');

let curOpts=[];
function options(){
  const pool=[],wc=Object.keys(P.weap).length,pc=Object.keys(P.pass).length;
  for(const id in UP){
    const u=UP[id],cur=u.w?(P.weap[id]?P.weap[id].l:0):(P.pass[id]||0);
    if(cur>=u.max)continue;if(u.w&&!cur&&wc>=4)continue;if(!u.w&&!cur&&pc>=5)continue;
    pool.push({id,cur,w:rnd()*(u.w?(cur?1.25:1.4):1)});
  }
  pool.sort((a,b)=>b.w-a.w);
  const o=pool.slice(0,3);if(!o.length)o.push({id:'heal',cur:0});return o;
}

  state='levelup';joy.on=false;lvlOpenAt=performance.now();curOpts=options();

function pickCard(i){
  if(state!=='levelup'||performance.now()-lvlOpenAt<350||!curOpts[i])return;
  const o=curOpts[i];
  if(o.id==='heal')P.flame=Math.min(P.maxFlame,P.flame+40);
  else if(UP[o.id].w){if(P.weap[o.id])P.weap[o.id].l++;else P.weap[o.id]={l:1,t:0}}

/* ---------- fim da partida + ranking ---------- */
let lastRun=null,lastRank=null,curMode=null;
function endRun(win){
  won=win;state='over';joy.on=false;
  runAsh=Math.floor(time/8)+Math.floor(P.kills/20)+P.lvl*2+(win?50:0);
  save.ash+=runAsh;
  if(time>save.best.time)save.best.time=Math.floor(time);
  if(P.kills>save.best.kills)save.best.kills=P.kills;
  const r={score:calcScore(time,P.kills,P.lvl),time:Math.floor(time),kills:P.kills,lvl:P.lvl,win:!!win,date:Date.now(),v:CONFIG.version};
  lastRun=r;lastRank=null;
  if(RC.mode==='daily'){if(!save.daily||save.daily.day!==RC.day)save.daily={day:RC.day,best:0,tries:0};save.daily.tries++;if(r.score>save.daily.best)save.daily.best=r.score}
  persist();sfx(win?'win':'over');
  const demoWin=win&&CONFIG.demo;
  $('overTitle').textContent=win?(CONFIG.demo?t('winDemo'):t('winFull')):t('over');
  $('overText').textContent=win?(CONFIG.demo?t('winText'):t('winFullText')):t('loseText');
  $('modeLine').textContent=RC.mode==='daily'?`${t('daily')} · ${fmtDay(RC.day)}`:`${FLAMES[RC.flame][LANG][0]} · ${MAPS[RC.map][LANG][0]} · ${MODES[RC.mode][LANG][0]}`;
  $('scoreVal').textContent=nf(r.score);$('recordTag').textContent='';
  $('stats').innerHTML=`<div>${t('time')}<b>${fmt(time)}</b></div><div>${t('kills')}<b>${P.kills}</b></div><div>${t('level')}<b>${P.lvl}</b></div><div>${t('ash')}<b>+${runAsh}</b></div>`;
  $('bSeeFull').style.display=CONFIG.demo?'inline-block':'none';
  $('bSeeFull').className=demoWin?'btn':'btn sec';
  $('bAgain').className=demoWin?'btn sec':'btn';
  $('bDiscord').style.display=CONFIG.linkDiscord?'inline-block':'none';
  $('nickErr').textContent='';$('boardList').innerHTML='';
  show('over');
  const mode=rankMode();curMode=mode;
  if(!mode){$('nickBox').style.display='none';$('boardBox').style.display='block';$('rankLine').textContent=t('noRankMode');return}
  if(!validRun(r)){$('nickBox').style.display='none';$('boardBox').style.display='block';$('rankLine').textContent=t('suspicious');showTop($('boardList'),mode);return}
  if(save.player&&save.tokens[save.player.toLowerCase()])submitRun(r,mode);
  else showNickBox(mode);
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function boardHTML(rows,me,meRow){
  if(!rows.length)return `<li class="empty">${t('empty')}</li>`;
  const isMe=r=>me&&r.nick.toLowerCase()===me.toLowerCase();
  const line=(r,pos)=>`<li class="${pos===1?'first ':''}${isMe(r)?'me':''}"><span class="pos">${pos===1?'👑':'#'+pos}</span><span class="nk">${esc(r.nick)}</span><span class="sc">${nf(r.score)}</span><span class="tm">${fmt(r.time)}</span></li>`;
  let h=rows.map((r,i)=>line(r,i+1)).join('');
  if(meRow&&meRow.rank>rows.length)h+=`<li class="sep">⋯</li>`+line(meRow,meRow.rank);
  return h;
}
async function showTop(el,mode){
  try{const rows=await BOARD.top(10,mode);const me=save.player?await BOARD.me(save.player,mode):null;el.innerHTML=boardHTML(rows,save.player,me);return me}
  catch(e){el.innerHTML=`<li class="empty">${t('saveErr')}</li>`;return null}
}
function showNickBox(mode){
  $('nickBox').style.display='block';$('boardBox').style.display='block';$('rankLine').textContent='';
  $('nickIn').value='';$('nickIn').placeholder=t('nickPh');
  showTop($('boardList'),mode);
  if(matchMedia('(pointer:fine)').matches)setTimeout(()=>$('nickIn').focus(),50);
}
async function submitRun(run,mode){
  $('nickBox').style.display='none';$('boardBox').style.display='block';$('rankLine').textContent=t('saving');
  try{
    const tok=save.tokens[save.player.toLowerCase()];
    const r=await BOARD.submit(save.player,tok,run,mode);
    if(!r||!r.ok){
      if(r&&r.error==='taken'){save.player=null;persist();showNickBox(mode);return}
      $('rankLine').textContent=t('suspicious');showTop($('boardList'),mode);return;
    }
    lastRank={rank:r.rank,daily:mode!=='main'};
    if(r.improved){$('recordTag').textContent=t('newRecord');sfx('win')}
    $('rankLine').textContent=t('rankPos')(r.rank,r.total)+(r.improved?'':` · ${t('yourBest')}: ${nf(r.best.score)}`);
    const rows=await BOARD.top(10,mode);
    $('boardList').innerHTML=boardHTML(rows,save.player,Object.assign({nick:save.player,rank:r.rank},r.best));
    flushPending();
  }catch(e){
    save.pending=(save.pending||[]).concat([Object.assign({nick:save.player,mode},run)]).slice(-20);persist();
    $('rankLine').textContent=t('saveErr');
  }
}
async function flushPending(){
  if(!save.pending||!save.pending.length)return;
  const rest=[];
  for(const p of save.pending){const tok=save.tokens[(p.nick||'').toLowerCase()];if(!tok)continue;
    try{await BOARD.submit(p.nick,tok,p,p.mode||'main')}catch(e){rest.push(p)}}
  save.pending=rest;persist();
}
async function openRank(mode){
  mode=mode||'main';state='rank';show('rankS');
  $('tabMain').classList.toggle('on',mode==='main');$('tabDaily').classList.toggle('on',mode!=='main');
  $('rankNote').textContent=mode==='main'?(BOARD_ONLINE?'':t('localNote')):t('dailyNote')(fmtDay(mode.slice(6)));
  $('bSwitch').style.display=save.player?'inline-block':'none';
  $('rankMe').textContent='';$('rankList').innerHTML='';
  const me=await showTop($('rankList'),mode);
  $('rankMe').textContent=save.player?(me?`${t('playingAs')} ${save.player} · ${t('rankPos')(me.rank,me.total)}`:`${t('playingAs')} ${save.player} · ${t('noRank')}`):'';
}

/* ---------- imagem para compartilhar ---------- */
function dot2(g,x,y,r){g.moveTo(x+r,y);g.arc(x,y,r,0,6.283)}
function makeCard(){
  const CW=1080,CH=1350,c=document.createElement('canvas');c.width=CW;c.height=CH;const g=c.getContext('2d');
  const r=lastRun,fc=FLAMES[RC.flame].color,F='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  g.fillStyle='#07030b';g.fillRect(0,0,CW,CH);
  let gr=g.createRadialGradient(540,540,0,540,540,640);gr.addColorStop(0,'rgba(255,110,20,.55)');gr.addColorStop(.35,'rgba(140,40,10,.22)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,CW,CH);
  let s=(r.score*2654435761)>>>0;const rr=()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296};
  const cols=['#ff3355','#c050ff','#ffa020','#40e0ff'];
  for(let i=0;i<90;i++){
    const x=rr()*CW,y=rr()*CH,dx=x-540,dy=y-520;if(dx*dx+dy*dy<360*360)continue;
    if(y>CH-150||(x>130&&x<950&&(y<215||(y>650&&y<1240))))continue;   // não cobrir os textos
    const sz=3+rr()*7,col=cols[i%4];
    g.fillStyle=col;g.globalAlpha=.22;g.beginPath();dot2(g,x-sz*1.7,y,sz*2.7);dot2(g,x+sz*1.7,y,sz*2.7);g.fill();
    g.globalAlpha=1;g.beginPath();dot2(g,x-sz*1.7,y,sz);dot2(g,x+sz*1.7,y,sz);g.fill();
  }
  g.globalCompositeOperation='lighter';
  gr=g.createRadialGradient(540,470,0,540,470,260);gr.addColorStop(0,'rgba(255,150,50,.55)');gr.addColorStop(1,'rgba(255,60,0,0)');g.fillStyle=gr;g.fillRect(280,210,520,520);
  g.globalCompositeOperation='source-over';
  g.fillStyle=fc[0];flameShape(540,560,95,330,6,g);
  g.fillStyle=fc[1];flameShape(540,560,70,240,4,g);
  g.fillStyle=fc[2];flameShape(540,560,40,140,2,g);
  g.fillStyle='#3a1500';g.beginPath();dot2(g,515,535,9);dot2(g,565,535,9);g.fill();
  g.textAlign='center';g.textBaseline='alphabetic';
  g.shadowColor='#ff3d00';g.shadowBlur=30;g.fillStyle='#ffcf70';g.font=`900 70px ${F}`;g.fillText(t('title').toUpperCase(),540,130);
  g.shadowBlur=0;
  const sub=RC.mode==='daily'?`${t('daily').toUpperCase()} · ${fmtDay(RC.day)}`:`${FLAMES[RC.flame][LANG][0]} · ${MAPS[RC.map][LANG][0]}`.toUpperCase();
  g.fillStyle='#ff9a4d';g.font=`700 30px ${F}`;g.fillText(sub,540,180);
  g.fillStyle='#d9c8b4';g.font=`800 46px ${F}`;g.fillText(t('cardSurv'),540,720);
  g.shadowColor='#ff5a00';g.shadowBlur=40;g.fillStyle='#fff1c8';g.font=`900 170px ${F}`;g.fillText(fmt(r.time),540,880);g.shadowBlur=0;
  g.fillStyle='#ffcf70';g.font=`800 60px ${F}`;g.fillText(`${nf(r.score)} ${t('cardPts')}`,540,970);
  let y=1040;
  if(lastRank){g.fillStyle='#ff9a4d';g.font=`800 44px ${F}`;g.fillText((lastRank.rank===1?'👑 ':'')+t('cardRank')(lastRank.rank,lastRank.daily),540,y);y+=64}
  g.fillStyle='#cdb9a3';g.font=`600 36px ${F}`;g.fillText(t('cardLine')(nf(r.kills),r.lvl),540,y);y+=62;
  if(save.player){g.fillStyle='#f4e9d8';g.font=`800 40px ${F}`;g.fillText('@'+save.player,540,y)}
  g.fillStyle='rgba(255,140,60,.18)';g.fillRect(0,CH-130,CW,130);
  g.fillStyle='#ffcf70';g.font=`900 44px ${F}`;g.fillText(t('cardAsk'),540,CH-72);
  const link=(CONFIG.linkWeb||CONFIG.linkFull||'').replace(/^https?:\/\//,'');
  g.fillStyle='#d9c8b4';g.font=`600 28px ${F}`;g.fillText(link||t('cardFree'),540,CH-28);
  return c;
}
async function shareRun(){
  if(!lastRun)return;
  const link=CONFIG.linkWeb||CONFIG.linkFull||(location.protocol.startsWith('http')&&!/127\.0\.0\.1|localhost/.test(location.hostname)?location.href:'');
  const txt=t('shareText')(fmt(lastRun.time),lastRun.kills)+(link?' '+link:'');
  const c=makeCard();
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));
  if(blob&&navigator.canShare){
    const file=new File([blob],'ultima-chama.png',{type:'image/png'});
    try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],text:txt});return}}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  if(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ultima-chama.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
  try{await navigator.clipboard.writeText(txt)}catch(e){}
  toast(t('imgSaved'));
}
function toast(msg,ms){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display='none',ms||2200)}

/* ---------- entrada ---------- */
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  keys[e.code]=true;
  if(e.code==='Escape'||e.code==='KeyP')togglePause();
  if(e.code==='KeyM'){initAudio();setMute(!save.mute)}
  if(state==='levelup'&&/^Digit[1-3]$/.test(e.code))pickCard(+e.code.slice(5)-1);
  if(e.code==='Enter'||e.code==='Space'){
    if(state==='menu'){e.preventDefault();initAudio();openSetup()}
    else if(state==='setup'){e.preventDefault();$('bGo').click()}
  }
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;initAudio();
  joy.on=true;joy.id=e.pointerId;joy.sx=e.clientX;joy.sy=e.clientY;joy.dx=0;joy.dy=0;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!joy.on||e.pointerId!==joy.id)return;
  let vx=e.clientX-joy.sx,vy=e.clientY-joy.sy;const l=Math.hypot(vx,vy);
  if(l>60){joy.sx+=vx/l*(l-60);joy.sy+=vy/l*(l-60);vx=e.clientX-joy.sx;vy=e.clientY-joy.sy}
  joy.dx=vx/50;joy.dy=vy/50;const m=Math.hypot(joy.dx,joy.dy);if(m>1){joy.dx/=m;joy.dy/=m}
});
const joyEnd=e=>{if(e.pointerId===joy.id){joy.on=false;joy.dx=joy.dy=0}};
cv.addEventListener('pointerup',joyEnd);cv.addEventListener('pointercancel',joyEnd);
cv.addEventListener('contextmenu',e=>e.preventDefault());

$('bSetupBack').onclick=toMenu;

$('bShopBack').onclick=toMenu;

$('bSeeFull').onclick=()=>openBuy('over');
$('bBuy').onclick=()=>CONFIG.linkFull&&window.open(CONFIG.linkFull,'_blank','noopener');
$('bBuyBack').onclick=backFromBuy;
$('bNotify').onclick=()=>openNotify('buy');
$('bNotifyBack').onclick=()=>{if(notifyFrom==='buy')openBuy();else toMenu()};
$('bInstall').onclick=doInstall;
$('bSound').onclick=$('bSound2').onclick=()=>{initAudio();setMute(!save.mute)};
$('bResume').onclick=togglePause;
$('bQuit').onclick=toMenu;
$('pbtn').onclick=togglePause;
$('bReroll').onclick=()=>{if(P.rerolls>0&&state==='levelup'){P.rerolls--;lvlOpenAt=0;openLevelUp()}};
$('bAgain').onclick=()=>startRun(RC.mode==='daily'?{flame:'vela',map:'floresta',mode:'daily',day:todayUTC()}:{flame:RC.flame,map:RC.map,mode:RC.mode});
$('bMenu').onclick=toMenu;
$('bShare').onclick=shareRun;
$('bDiscord').onclick=()=>CONFIG.linkDiscord&&window.open(CONFIG.linkDiscord,'_blank','noopener');
$('bRank').onclick=()=>{initAudio();openRank('main')};
$('tabMain').onclick=()=>openRank('main');
$('tabDaily').onclick=()=>openRank('daily:'+todayUTC());
$('bRankBack').onclick=toMenu;
$('bSwitch').onclick=()=>{save.player=null;persist();toast(t('switched'));openRank('main')};
$('bSkip').onclick=()=>{$('nickBox').style.display='none';$('rankLine').textContent=t('noSave')};
$('nickForm').onsubmit=async e=>{
  e.preventDefault();
  let err;
  try{err=await claimNick($('nickIn').value)}catch(_){err='saveErr'}
  if(err){$('nickErr').textContent=t(err);$('nickIn').focus();return}
  $('nickErr').textContent='';$('nickIn').blur();
  if(lastRun&&curMode)submitRun(lastRun,curMode);
};
$('notifyForm').onsubmit=async e=>{
  e.preventDefault();
  const em=$('emailIn').value.trim(),m=$('notifyMsg');m.className='err';
  if(em.length>254||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){m.textContent=t('badEmail');return}
  if(!$('consentIn').checked){m.textContent=t('needConsent');return}
  if(!BOARD_ONLINE){m.textContent=t('offlineFeat');return}
  m.textContent=t('saving');
  try{
    const r=await BOARD.subscribe(em,LANG,CONFIG.demo?'demo':'full');
    if(r&&r.ok){save.subscribed=true;persist();m.className='err ok';m.textContent=t('thanks');$('emailIn').value='';$('consentIn').checked=false}
    else m.textContent=t('badEmail');
  }catch(_){m.textContent=t('saveErr')}
};

/* ---------- laço principal ---------- */
newRun();fillMenu();flushPending();
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;clock+=dt;
  if(state==='play')update(dt);
  shake*=Math.pow(.004,dt);if(shake<.2)shake=0;
  music(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
